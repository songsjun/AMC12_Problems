<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="title desc">
  <title id="title">Concentric major and minor arcs</title>
  <desc id="desc">Major arc AD and minor arc BC have center O. Segments AB and CD connect the arcs.</desc>
  <rect width="360" height="300" fill="#ffffff"/>
  <path d="M202 180 A60 60 0 1 0 202 120" fill="none" stroke="#1f3b5b" stroke-width="3"/>
  <path d="M267 217.5 A135 135 0 0 0 267 82.5" fill="none" stroke="#1f3b5b" stroke-width="3"/>
  <path d="M150 150 L202 180 M150 150 L202 120" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M202 180 L267 217.5 M202 120 L267 82.5" fill="none" stroke="#172033" stroke-width="2.5"/>
  <g fill="#172033"><circle cx="150" cy="150" r="3.5"/><circle cx="202" cy="180" r="3.5"/><circle cx="267" cy="217.5" r="3.5"/><circle cx="267" cy="82.5" r="3.5"/><circle cx="202" cy="120" r="3.5"/></g>
  <g font-family="serif" font-size="18" fill="#172033">
    <text x="132" y="145">O</text><text x="198" y="202">A</text><text x="274" y="230">B</text>
    <text x="274" y="82">C</text><text x="198" y="113">D</text>
  </g>
  <text x="31" y="153" font-family="serif" font-size="15" fill="#475569">major arc AD = 2π</text>
  <text x="218" y="49" font-family="serif" font-size="15" fill="#475569">minor arc BC = 2π</text>
</svg>

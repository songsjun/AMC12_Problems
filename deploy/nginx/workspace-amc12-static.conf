# This server accepts only a local Cloudflare Tunnel or local portal/Homebrew
# proxy. Once that boundary is in place, the normalized Cloudflare client-IP
# header can be handed to the loopback-trusting API without accepting a
# browser-supplied X-Forwarded-For value.
map $http_cf_connecting_ip $amc12_client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

server {
    listen 8084;
    server_name localhost amc12.kapy.ca;
    root /Users/ss/Workspaces/education/AMC12_Problems;
    index index.html;

    charset utf-8;

    allow 127.0.0.1;
    allow ::1;
    deny all;

    location ~ /\. {
        deny all;
    }

    # These are application/source directories, not public archive assets.
    # Keep the deny explicit even though directory listing is off: an
    # accidental file request must never expose API source, dependencies,
    # private manifests, answer keys, or review artefacts.
    location = /practice-api {
        return 404;
    }

    location ^~ /practice-api/ {
        return 404;
    }

    location = /practice-content {
        return 404;
    }

    location ^~ /practice-content/ {
        return 404;
    }

    # Defense in depth only: production startup also requires the configured
    # private upload root to be outside this entire static/source tree.
    location = /private-uploads {
        return 404;
    }

    location ^~ /private-uploads/ {
        return 404;
    }

    # The deployment host may use a case-insensitive filesystem. Catch case
    # variants too; otherwise `/Practice-Api/...` could resolve on disk while
    # bypassing the lower-case prefix locations above.
    location ~* ^/(?:practice-api|practice-content|private-uploads)(?:/|$) {
        return 404;
    }

    # Defense in depth for conventional private upload directory names. The
    # Node processes independently refuse any configured private root under
    # this static workspace, so arbitrary external private-root paths cannot
    # become URL-addressable even though nginx cannot interpolate that config.
    location ~* ^/(?:private-uploads?|amc12-private|\.amc12-private)(?:/|$) {
        return 404;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        # Archive scripts, Markdown parser, sanitizer, and MathJax are all
        # fixed local assets.  MathJax creates its own rendering styles, so
        # style-src needs unsafe-inline while script-src remains self-only.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; media-src 'none'; worker-src 'none'" always;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; media-src 'none'; worker-src 'none'" always;
    }

    location = /viewer.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; media-src 'none'; worker-src 'none'" always;
    }

    # Keep the public archive static, but route the authenticated practice
    # client to a loopback-only API.  Do not expose the API listener directly
    # through a Cloudflare Tunnel or add credentials/secrets to nginx.
    location ^~ /api/amc12/ {
        client_max_body_size 64k;

        # This is the only large request envelope. It is a raw, pre-reserved
        # private asset body; every JSON route remains capped at 64 KiB.
        location ~ "^/api/amc12/attempts/[0-9a-fA-F-]{36}/learning-batches/[0-9a-fA-F-]{36}/assets/[0-9a-fA-F-]{36}/body$" {
            client_max_body_size 25m;
            proxy_request_buffering off;
            # proxy_pass is not inherited by a nested location.
            proxy_pass http://127.0.0.1:8090;
        }

        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $amc12_client_ip;
        proxy_set_header X-Forwarded-For $amc12_client_ip;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    location = /practice {
        return 301 /practice/;
    }

    # Homebrew's stock mime.types maps .js but not .mjs. The SPA entry point is
    # deliberately an ES module, so give this exact file a JavaScript MIME
    # type without replacing the inherited MIME table for CSS, vendor JS, or
    # MathJax font resources.
    location = /practice/app.mjs {
        try_files $uri =404;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # The UI is intentionally not long-cached: an old client and a newer API
    # could otherwise disagree about the state machine or CSRF contract.
    location ^~ /practice/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        # MathJax injects rendering styles at runtime, so style-src needs
        # unsafe-inline; scripts remain same-origin only and are self-hosted.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Figures are repository-controlled SVG assets. Serve them only as images
    # and give direct navigations a restrictive policy too, so an accidental
    # future active SVG cannot run script or load external content.
    location ~* \.svg$ {
        try_files $uri =404;
        default_type image/svg+xml;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; script-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'none'; connect-src 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    location ~* \.md$ {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
    }

    location ~* \.raw\.txt$ {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log logs/amc12-access.log;
    error_log logs/amc12-error.log;
}

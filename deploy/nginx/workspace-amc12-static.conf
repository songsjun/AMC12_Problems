server {
    listen 8084;
    server_name localhost amc12.kapy.ca;
    root /Users/ss/Workspaces/education/AMC12_Problems;
    index index.html;

    charset utf-8;

    location ~ /\. {
        deny all;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location ~* \.md$ {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
    }

    location ~* \.raw\.txt$ {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log logs/amc12-access.log;
    error_log logs/amc12-error.log;
}


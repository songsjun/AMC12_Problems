<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMC 12 Problems Archive</title>
<script>
MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']],
    displayMath: [['\\[', '\\]']],
    processEscapes: false,
    processEnvironments: true,
    tags: 'ams'
  },
  options: {
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --c-bg: #f7f8fa;
  --c-card: #ffffff;
  --c-primary: #1e293b;
  --c-accent: #3b82f6;
  --c-accent-hover: #2563eb;
  --c-text: #334155;
  --c-text-muted: #94a3b8;
  --c-border: #e2e8f0;
  --c-details-bg: #f8fafc;
  --c-details-hover: #f1f5f9;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --radius: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  background: var(--c-bg);
  color: var(--c-text);
  line-height: 1.6;
}

/* ── Header ── */
.header {
  background: var(--c-primary);
  color: white;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.header h1 {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.3px;
  white-space: nowrap;
}
.header .spacer { flex: 1; min-width: 4px; }
.header .nav-group {
  display: flex;
  align-items: center;
  gap: 6px;
}
.header label {
  font-size: 12px;
  color: #94a3b8;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.header select {
  padding: 5px 10px;
  border-radius: 6px;
  border: 1px solid #475569;
  background: #334155;
  color: white;
  font-size: 14px;
  cursor: pointer;
  outline: none;
}
.header select:hover { background: #475569; }
.header select:focus { border-color: var(--c-accent); }

/* ── Problem number pills ── */
.problem-nav {
  display: flex;
  gap: 2px;
  flex-wrap: wrap;
}
.problem-nav button {
  width: 30px;
  height: 26px;
  padding: 0;
  font-size: 12px;
  font-weight: 500;
  text-align: center;
  border: 1px solid #475569;
  background: #334155;
  color: #cbd5e1;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
}
.problem-nav button.active {
  background: var(--c-accent);
  color: white;
  font-weight: 700;
  border-color: var(--c-accent);
}
.problem-nav button:hover:not(.active) {
  background: #475569;
  color: white;
}

/* ── Arrow buttons ── */
.nav-arrow {
  width: 32px;
  height: 28px;
  border: 1px solid #475569;
  background: #334155;
  color: #cbd5e1;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.nav-arrow:hover { background: #475569; color: white; }

/* ── Main content ── */
.container {
  max-width: 860px;
  margin: 24px auto;
  padding: 0 16px;
}

.toolbar {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-bottom: 12px;
}
.toolbar button {
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--c-border);
  background: var(--c-card);
  color: var(--c-text);
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
}
.toolbar button:hover {
  background: var(--c-details-hover);
  border-color: var(--c-accent);
  color: var(--c-accent);
}

.content {
  background: var(--c-card);
  border-radius: var(--radius);
  padding: 36px 44px;
  box-shadow: var(--shadow-md);
  line-height: 1.85;
  font-size: 16px;
  min-height: 200px;
}

/* ── Typography ── */
.content h1 {
  font-size: 22px;
  font-weight: 700;
  color: var(--c-primary);
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--c-border);
}
.content h2 {
  font-size: 18px;
  font-weight: 600;
  color: var(--c-primary);
  margin: 20px 0 10px;
}
.content p { margin: 8px 0; }
.content blockquote {
  border-left: 3px solid var(--c-accent);
  padding: 8px 16px;
  color: #64748b;
  margin: 12px 0;
  background: var(--c-details-bg);
  border-radius: 0 var(--radius) var(--radius) 0;
  font-size: 14px;
}
.content pre {
  background: #f1f5f9;
  border: 1px solid var(--c-border);
  border-radius: 6px;
  padding: 14px;
  overflow-x: auto;
  font-size: 13px;
}
.content code {
  background: #f1f5f9;
  padding: 2px 5px;
  border-radius: 4px;
  font-size: 14px;
}
.content pre code { background: none; padding: 0; }
.content em { color: #64748b; }
.content a { color: var(--c-accent); text-decoration: none; }
.content a:hover { text-decoration: underline; }

/* ── Collapsible solution sections ── */
.content details {
  margin: 16px 0;
  border: 1px solid var(--c-border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: box-shadow 0.2s;
}
.content details:hover {
  box-shadow: var(--shadow-sm);
}
.content details[open] {
  box-shadow: var(--shadow-sm);
}
.content details summary {
  padding: 12px 18px;
  background: var(--c-details-bg);
  cursor: pointer;
  font-weight: 600;
  font-size: 16px;
  color: var(--c-primary);
  list-style: none;
  display: flex;
  align-items: center;
  gap: 10px;
  user-select: none;
  transition: background 0.15s;
}
.content details summary:hover {
  background: var(--c-details-hover);
}
.content details summary::-webkit-details-marker { display: none; }
.content details summary::before {
  content: '▸';
  font-size: 14px;
  color: var(--c-accent);
  transition: transform 0.2s;
  display: inline-block;
  width: 16px;
  flex-shrink: 0;
}
.content details[open] summary::before {
  transform: rotate(90deg);
}
.content details .section-body {
  padding: 16px 20px 20px;
  border-top: 1px solid var(--c-border);
}
.content details .section-body h2 {
  display: none; /* Hide the h2 inside since we use summary */
}
.content details .section-body p:first-child { margin-top: 0; }

/* ── Status bar ── */
.status-bar {
  text-align: center;
  padding: 12px 8px;
  color: var(--c-text-muted);
  font-size: 13px;
}
.status-bar a {
  color: var(--c-accent);
  text-decoration: none;
}
.status-bar a:hover { text-decoration: underline; }
.status-bar .kbd {
  display: inline-block;
  padding: 1px 6px;
  background: #e2e8f0;
  border-radius: 4px;
  font-size: 11px;
  font-family: monospace;
  color: #475569;
}

.loading {
  color: var(--c-text-muted);
  font-style: italic;
  padding: 48px;
  text-align: center;
}
.error {
  color: #dc2626;
  padding: 48px;
  text-align: center;
}

/* ── Responsive ── */
@media (max-width: 700px) {
  .content { padding: 20px 18px; }
  .header { padding: 8px 12px; gap: 8px; }
  .header h1 { font-size: 15px; }
  .problem-nav button { width: 26px; height: 24px; font-size: 11px; }
}
</style>
</head>
<body>
<div class="header">
  <h1>AMC 12 Archive</h1>
  <div class="spacer"></div>
  <div class="nav-group">
    <label>Year</label>
    <select id="yearSelect"></select>
  </div>
  <div class="nav-group">
    <label>Variant</label>
    <select id="variantSelect">
      <option value="A">A</option>
      <option value="B">B</option>
    </select>
  </div>
  <div class="nav-group">
    <label>Problem</label>
    <div class="problem-nav" id="problemNav"></div>
  </div>
  <button class="nav-arrow" onclick="loadPrev()" title="Previous (←)">◀</button>
  <button class="nav-arrow" onclick="loadNext()" title="Next (→)">▶</button>
</div>

<div class="container">
  <div class="toolbar" id="toolbar" style="display:none">
    <button onclick="toggleAll(true)">Expand All</button>
    <button onclick="toggleAll(false)">Collapse All</button>
  </div>
  <div class="content" id="content">
    <div class="loading">Select a problem to view…</div>
  </div>
  <div class="status-bar" id="statusBar"></div>
</div>

<script>
/* ── Data ── */
const YEARS = [];
for (let y = 2025; y >= 2002; y--) YEARS.push(y);

let currentYear = 2025, currentVariant = 'A', currentProblem = 1;

/* ── Build selectors ── */
const yearSel = document.getElementById('yearSelect');
YEARS.forEach(y => {
  const o = document.createElement('option');
  o.value = y; o.textContent = y;
  yearSel.appendChild(o);
});

const problemNav = document.getElementById('problemNav');
for (let i = 1; i <= 25; i++) {
  const b = document.createElement('button');
  b.textContent = i;
  b.onclick = () => loadProblem(currentYear, currentVariant, i);
  problemNav.appendChild(b);
}

function updateProblemNav() {
  problemNav.querySelectorAll('button').forEach((b, i) =>
    b.classList.toggle('active', i + 1 === currentProblem));
}

/* ── Paths ── */
function filePath(year, variant, num) {
  return `${year}_AMC_12${variant}_Problems/Problem_${String(num).padStart(2,'0')}.md`;
}
function aopsUrl(year, variant, num) {
  return `https://artofproblemsolving.com/wiki/index.php/${year}_AMC_12${variant}_Problems/Problem_${num}`;
}

/* ── Math protection (reused from viewer.html) ── */
function protectMath(md) {
  const blocks = [];
  let idx = 0;
  const lines = md.split('\n');
  let inDisplay = false, dispLines = [];
  const out = [];

  for (const line of lines) {
    const t = line.trim();
    if (inDisplay) {
      if (t === '$$' || t.endsWith('$$')) {
        let c = (t.endsWith('$$') && t !== '$$') ? t.slice(0, -2) : '';
        if (c) dispLines.push(c);
        const key = `%%MB${idx}%%`;
        blocks.push({ key, content: dispLines.join('\n'), display: true });
        idx++;
        out.push(key);
        inDisplay = false;
        dispLines = [];
      } else {
        dispLines.push(line);
      }
    } else if (t.startsWith('$$')) {
      if (t.endsWith('$$') && t.length > 4) {
        const key = `%%MB${idx}%%`;
        blocks.push({ key, content: t.slice(2, -2), display: true });
        idx++; out.push(key);
      } else if (t === '$$') {
        inDisplay = true; dispLines = [];
      } else {
        inDisplay = true; dispLines = [t.slice(2)];
      }
    } else {
      let prot = line.replace(/(?<!\$)\$(?!\$)((?:[^\$\n]|\\\$)+?)\$(?!\$)/g, (_, inner) => {
        const key = `%%MB${idx}%%`;
        blocks.push({ key, content: inner, display: false });
        idx++;
        return key;
      });
      out.push(prot);
    }
  }
  return { text: out.join('\n'), blocks };
}

function restoreMath(html, blocks) {
  for (const { key, content, display } of blocks) {
    const safe = display ? `\\[${content}\\]` : `\\(${content}\\)`;
    html = html.split(key).join(safe);
  }
  return html;
}

/* ── Split HTML into problem + collapsible solution sections ── */
function makeCollapsible(html) {
  // Split at <h2> boundaries
  // We insert a sentinel before every <h2 to split on
  const parts = html.split(/(?=<h2[ >])/i);

  let alwaysVisible = '';
  const sections = [];

  for (const part of parts) {
    // Extract h2 title
    const h2Match = part.match(/<h2[^>]*>(.*?)<\/h2>/i);
    if (!h2Match) {
      // Content before any h2 (title, blockquote, etc.) — always visible
      alwaysVisible += part;
      continue;
    }
    const title = h2Match[1].trim();
    const titleLower = title.toLowerCase();

    if (titleLower === 'problem') {
      // Problem section is always visible
      alwaysVisible += part;
    } else if (titleLower.startsWith('see also')) {
      // Skip "See also" section
      continue;
    } else {
      // Everything else is collapsible
      sections.push({ title, body: part });
    }
  }

  // Build collapsible HTML
  let result = alwaysVisible;
  for (const { title, body } of sections) {
    result += `<details><summary>${title}</summary><div class="section-body">${body}</div></details>`;
  }
  return result;
}

/* ── Load & render ── */
async function loadProblem(year, variant, num) {
  currentYear = year;
  currentVariant = variant;
  currentProblem = num;

  yearSel.value = year;
  document.getElementById('variantSelect').value = variant;
  updateProblemNav();

  const el = document.getElementById('content');
  const status = document.getElementById('statusBar');
  el.innerHTML = '<div class="loading">Loading…</div>';
  document.getElementById('toolbar').style.display = 'none';

  try {
    const resp = await fetch(filePath(year, variant, num));
    if (!resp.ok) throw new Error(`File not found: ${filePath(year, variant, num)}`);
    const md = await resp.text();

    // Protect math → parse markdown → restore math
    const { text, blocks } = protectMath(md);
    let html = marked.parse(text);
    html = restoreMath(html, blocks);

    // Make solutions collapsible
    html = makeCollapsible(html);

    el.innerHTML = html;
    document.getElementById('toolbar').style.display = 'flex';

    // Typeset math
    if (window.MathJax && MathJax.typesetPromise) {
      await MathJax.typesetPromise([el]);
    }

    const url = aopsUrl(year, variant, num);
    status.innerHTML = `${year} AMC 12${variant} Problem ${num} · <a href="${url}" target="_blank">View on AoPS ↗</a> · <span class="kbd">←</span> <span class="kbd">→</span> navigate`;

    window.location.hash = `#${year}${variant}P${num}`;
  } catch (e) {
    el.innerHTML = `<div class="error">${e.message}</div>`;
    status.textContent = '';
  }
}

/* ── Expand / Collapse All ── */
function toggleAll(open) {
  document.querySelectorAll('.content details').forEach(d => d.open = open);
  // Re-typeset newly revealed math
  if (open && window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise([document.getElementById('content')]);
  }
}

/* ── Navigation ── */
function loadPrev() {
  if (currentProblem > 1) loadProblem(currentYear, currentVariant, currentProblem - 1);
  else if (currentVariant === 'B') loadProblem(currentYear, 'A', 25);
  else {
    const i = YEARS.indexOf(currentYear);
    if (i < YEARS.length - 1) loadProblem(YEARS[i + 1], 'B', 25);
  }
}
function loadNext() {
  if (currentProblem < 25) loadProblem(currentYear, currentVariant, currentProblem + 1);
  else if (currentVariant === 'A') loadProblem(currentYear, 'B', 1);
  else {
    const i = YEARS.indexOf(currentYear);
    if (i > 0) loadProblem(YEARS[i - 1], 'A', 1);
  }
}

yearSel.addEventListener('change', () => loadProblem(+yearSel.value, currentVariant, currentProblem));
document.getElementById('variantSelect').addEventListener('change', e => loadProblem(currentYear, e.target.value, currentProblem));

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft')  { e.preventDefault(); loadPrev(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); loadNext(); }
});

/* ── URL hash ── */
function parseHash() {
  const m = window.location.hash.match(/#(\d{4})([AB])P(\d+)/);
  return m ? { year: +m[1], variant: m[2], problem: +m[3] } : null;
}
window.addEventListener('hashchange', () => {
  const p = parseHash();
  if (p) loadProblem(p.year, p.variant, p.problem);
});

/* ── Init ── */
const init = parseHash();
loadProblem(init ? init.year : 2025, init ? init.variant : 'A', init ? init.problem : 1);
</script>
</body>
</html>

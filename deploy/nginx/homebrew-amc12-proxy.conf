server {
    listen       8080;
    server_name  amc12.kapy.ca;

    # The public entrypoint is Cloudflare Tunnel, which connects locally.
    # Restricting this vhost prevents a LAN/browser client from injecting a
    # fake CF-Connecting-IP that the workspace API route would trust.
    allow 127.0.0.1;
    allow ::1;
    deny all;

    # /api/amc12/ intentionally continues to the workspace nginx below. That
    # layer serves /practice/ and proxies only this fixed API prefix to the
    # loopback API listener, keeping the archive's public static behavior.
    # CF-Connecting-IP is preserved for that inner loopback-restricted trust
    # boundary; never append a caller-provided X-Forwarded-For value here.
    location / {
        client_max_body_size 64k;

        # The workspace nginx and Fastify enforce this independently. Disable
        # request buffering only for the raw upload path so ordinary JSON
        # requests retain the 64 KiB boundary at every proxy hop.
        location ~ "^/api/amc12/attempts/[0-9a-fA-F-]{36}/learning-batches/[0-9a-fA-F-]{36}/assets/[0-9a-fA-F-]{36}/body$" {
            client_max_body_size 25m;
            proxy_request_buffering off;
            # proxy_pass is not inherited by a nested location.
            proxy_pass http://127.0.0.1:8084;
        }

        proxy_pass         http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    access_log /opt/homebrew/var/log/nginx/amc12-access.log;
    error_log  /opt/homebrew/var/log/nginx/amc12-error.log;
}

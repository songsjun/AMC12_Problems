# Replace (do not add alongside) any existing portal `location = /amc12` and
# `location /amc12/` blocks with this fragment inside the existing
# education-portal `server { ... }` block. Duplicate nginx locations make the
# effective configuration invalid. The `^~` prefix is required: otherwise a
# generic `~* \\.(js|css|...)$` portal rule can intercept practice scripts before
# they reach the AMC workspace proxy.

location = /amc12 {
    return 301 /amc12/;
}

# Do this redirect at the portal layer. A workspace-level redirect to
# `/practice/` is correct for the direct host but would drop this portal's
# `/amc12` mount prefix.
location = /amc12/practice {
    allow 127.0.0.1;
    allow ::1;
    deny all;

    return 308 /amc12/practice/$is_args$args;
}

# This portal route receives traffic only from its local Cloudflare Tunnel or
# another local trusted proxy. It canonicalizes the client address once and
# passes it to the loopback-only workspace server. Never append inbound XFF.
location ^~ /amc12/ {
    allow 127.0.0.1;
    allow ::1;
    deny all;

    client_max_body_size 64k;

    # Preserve streaming only for the exact raw private-asset PUT. The inner
    # workspace proxy independently enforces the same 25 MiB ceiling.
    location ~ "^/amc12/api/amc12/attempts/[0-9a-fA-F-]{36}/learning-batches/[0-9a-fA-F-]{36}/assets/[0-9a-fA-F-]{36}/body$" {
        client_max_body_size 25m;
        proxy_request_buffering off;
        # A regex location cannot use proxy_pass with a URI component. Apply
        # the portal mount rewrite explicitly, then proxy without one.
        rewrite ^/amc12/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8084;
    }

    proxy_pass http://127.0.0.1:8084/;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $amc12_portal_client_ip;
    proxy_set_header X-Forwarded-For $amc12_portal_client_ip;
    # The inner workspace server accepts only loopback peers and uses this
    # normalized header to set its API client's address, then clears it before
    # proxying to Node.
    proxy_set_header CF-Connecting-IP $amc12_portal_client_ip;
    proxy_set_header X-Forwarded-Proto $amc12_portal_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $amc12_portal_forwarded_port;
    proxy_set_header Connection "";
    # The upstream API uses Path=/api/amc12. Externally the API is mounted at
    # /amc12/api/amc12, so rewrite both auth and CSRF cookies to that prefix.
    proxy_cookie_path /api/amc12 /amc12/api/amc12;
    add_header Cache-Control "no-cache";
}

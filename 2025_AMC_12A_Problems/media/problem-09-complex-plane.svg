<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 300" role="img" aria-labelledby="title desc">
  <title id="title">Complex plane for w and w squared</title>
  <desc id="desc">The points w equals 2 plus i and w squared equal 3 plus 4i lie on a line meeting the real axis at r.</desc>
  <rect width="410" height="300" fill="#ffffff"/>
  <g stroke="#d6dee8" stroke-width="1">
    <path d="M70 60H340 M70 105H340 M70 150H340 M70 195H340 M70 240H340"/>
    <path d="M70 60V240 M115 60V240 M160 60V240 M205 60V240 M250 60V240 M295 60V240 M340 60V240"/>
  </g>
  <path d="M62 240H353 M160 252V47" fill="none" stroke="#172033" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M62 240H353" fill="none" stroke="#172033" stroke-width="2" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#172033"/></marker></defs>
  <path d="M160 240 L250 195 L295 60" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <path d="M250 195 L295 60 L235 240" fill="none" stroke="#be123c" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="#172033"><circle cx="250" cy="195" r="4"/><circle cx="295" cy="60" r="4"/><circle cx="235" cy="240" r="4"/></g>
  <g font-family="serif" font-size="17" fill="#172033">
    <text x="357" y="246">Re</text><text x="167" y="54">Im</text><text x="256" y="189">w = 2 + i</text>
    <text x="301" y="57">w²</text><text x="223" y="262">r</text><text x="182" y="226">θ</text><text x="192" y="204">θ</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" role="img" aria-labelledby="title desc">
  <title id="title">Cyclic pentagon ABCDE for AMC 12A Problem 8</title>
  <desc id="desc">Pentagon ABCDE lies on a circle. Chords AB and AD have lengths 9 and 24 respectively, and diagonals AC and BD intersect at F. The two angles at E are each 30 degrees.</desc>
  <rect width="520" height="430" fill="#ffffff"/>
  <circle cx="240" cy="205" r="157.617" fill="#f8fbff" stroke="#243b53" stroke-width="2.4"/>

  <!-- The coordinates are a 13-pixels-per-unit rendering of the source construction
       with circumradius 7√3: AB = 9 and AD = 24 exactly before rounding. -->
  <path d="M284.571 53.817 L376.500 126.192 L376.500 283.808 L240 362.617 L82.383 205 Z"
        fill="none" stroke="#243b53" stroke-width="2.7" stroke-linejoin="round"/>
  <path d="M376.500 126.192 L82.383 205 L376.500 283.808"
        fill="none" stroke="#94a3b8" stroke-width="1.8"/>
  <path d="M284.571 53.817 L376.500 283.808 M376.500 126.192 L240 362.617"
        fill="none" stroke="#64748b" stroke-width="1.9"/>

  <path d="M117.16 195.68 A36 36 0 0 1 117.16 214.32 M117.16 214.32 A36 36 0 0 1 107.84 230.46"
        fill="none" stroke="#be123c" stroke-width="1.8"/>
  <g fill="#be123c" font-family="serif" font-size="15">
    <text x="128" y="197">30°</text>
    <text x="119" y="232">30°</text>
  </g>

  <g fill="#172033">
    <circle cx="284.571" cy="53.817" r="3.7"/><circle cx="376.500" cy="126.192" r="3.7"/>
    <circle cx="376.500" cy="283.808" r="3.7"/><circle cx="240" cy="362.617" r="3.7"/>
    <circle cx="82.383" cy="205" r="3.7"/><circle cx="339.273" cy="190.671" r="3.7"/>
  </g>
  <g fill="#172033" font-family="serif" font-size="19">
    <text x="270" y="45">A</text><text x="385" y="122">B</text><text x="385" y="297">C</text>
    <text x="232" y="384">D</text><text x="61" y="211">E</text><text x="346" y="187">F</text>
  </g>
  <g fill="#0f4c81" font-family="serif" font-size="18" font-weight="700">
    <text x="338" y="80">9</text>
    <text x="275" y="213">24</text>
  </g>
</svg>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AMC 12 Problems Archive</title>
  <link rel="stylesheet" href="archive/reader.css" integrity="sha384-uav7Hy8sfyZ9azI1g8rOgu4rBwKfUxbOifjDoFuy1IToFIMQwCnC9Ydq7HuThfqX" crossorigin="anonymous">
  <script defer src="archive/mathjax-config.js" integrity="sha384-RzYaBzE5CrnMNeKwHXtj54N/H5zVlRlLIiKb+t+s7hQeQik4oI8PTXJJtRcNwj3l" crossorigin="anonymous"></script>
  <script defer src="practice/vendor/mathjax/tex-svg-full.js" integrity="sha384-4kE/rQ11E8xT9QgrCBTyvenkuPfQo8rXYQvJZuMgxyPOoUfpatjQPlgdv6V5yhUK" crossorigin="anonymous"></script>
  <script defer src="archive/vendor/marked/marked.umd.js" integrity="sha384-7njNzKcJUBdezPGfqUrIFizi2QkXJH0M6wF3o1h9GE/nce6X4YdecMwh31B19yTi" crossorigin="anonymous"></script>
  <script defer src="archive/vendor/dompurify/purify.min.js" integrity="sha384-piCcpDdJ7qVeK4Tv8Z6Hpcr3ZBIgP16TxQTPVfsLFdZ5uDgwc3Y8Ho7oUnqf12qu" crossorigin="anonymous"></script>
  <script type="module" src="archive/reader.js" integrity="sha384-lKaiQf9HxhBq3JYCLSi781YJly7k2LtH8/W/GCgWDhJyI7tkjfSJ47LADTb1E0JU" crossorigin="anonymous"></script>
</head>
<body data-archive-reader data-archive-mode="archive">
  <header class="header">
    <h1>AMC 12 Archive</h1>
    <a
      class="practice-link"
      id="practiceEntry"
      href="practice/"
      aria-haspopup="dialog"
      aria-controls="practiceChoiceDialog"
    >Practice test</a>
    <div class="spacer"></div>
    <div class="nav-group">
      <label for="yearSelect">Year</label>
      <select id="yearSelect"></select>
    </div>
    <div class="nav-group">
      <label for="variantSelect">Variant</label>
      <select id="variantSelect">
        <option value="A">A</option>
        <option value="B">B</option>
      </select>
    </div>
    <div class="nav-group">
      <span class="header-label">Problem</span>
      <div class="problem-nav" id="problemNav" aria-label="Problem navigation"></div>
    </div>
    <button class="nav-arrow" id="previousProblem" type="button" title="Previous problem (Left Arrow)" aria-label="Previous problem">◀</button>
    <button class="nav-arrow" id="nextProblem" type="button" title="Next problem (Right Arrow)" aria-label="Next problem">▶</button>
  </header>

  <dialog
    class="practice-dialog"
    id="practiceChoiceDialog"
    aria-labelledby="practiceChoiceTitle"
    aria-describedby="practiceChoiceDescription"
  >
    <div class="practice-dialog-content">
      <h2 id="practiceChoiceTitle">Practice this paper</h2>
      <p id="practiceChoiceDescription">Choose how to work on 2025 AMC 12A.</p>
      <div class="practice-choices">
        <a id="practiceModeLink" href="practice/?form=amc12-2025-a&amp;mode=practice">
          <strong>Question-by-question test</strong>
          <span>Answer and record your reasoning one problem at a time.</span>
        </a>
        <a id="batchModeLink" href="practice/?form=amc12-2025-a&amp;mode=batch">
          <strong>Batch submission</strong>
          <span>Add text or audio to this paper's existing completed result.</span>
        </a>
      </div>
      <div class="practice-dialog-actions">
        <button id="practiceChoiceCancel" type="button">Cancel</button>
      </div>
    </div>
  </dialog>

  <main class="container">
    <div class="toolbar" id="toolbar" hidden>
      <button id="expandAll" type="button">Expand all</button>
      <button id="collapseAll" type="button">Collapse all</button>
    </div>
    <article class="content" id="content" aria-live="polite">
      <div class="loading">Select a problem to view…</div>
    </article>
    <p class="status-bar" id="statusBar" aria-live="polite"></p>
  </main>
</body>
</html>

# Include this fragment once in the portal nginx `http { ... }` block.
#
# The portal accepts only its local Cloudflare Tunnel on the AMC routes below.
# Therefore CF-Connecting-IP is trusted only after the route's loopback ACL
# has run. The proxy location forwards this normalized value to the inner
# loopback-only AMC workspace server, which clears it before calling the API.
map $http_cf_connecting_ip $amc12_portal_client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

# Preserve the externally visible scheme through the two local proxy hops.
# Cloudflare's CF-Visitor is preferred; the normal forwarded header is the
# fallback. These headers are consumed only on loopback-restricted AMC paths.
map $http_x_forwarded_proto $amc12_portal_forwarded_proto_from_header {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_cf_visitor $amc12_portal_forwarded_proto {
    default              $amc12_portal_forwarded_proto_from_header;
    ~*"scheme":"https"  https;
    ~*"scheme":"http"   http;
}

map $amc12_portal_forwarded_proto $amc12_portal_forwarded_port {
    https   443;
    default $server_port;
}
